<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Clean | Key Repair</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff; --card: #f8fafc; --text: #0f172a; --subtext: #64748b;
            --border: #e2e8f0; --accent: #6366f1; --pre-bg: #f1f5f9;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --subtext: #94a3b8;
            --border: #334155; --accent: #818cf8; --pre-bg: #0d1117;
        }
        body {
            background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
            transition: all 0.4s ease; margin: 0; padding: 40px 20px; min-height: 100vh;
        }
        .container { max-width: 700px; margin: 0 auto; position: relative; }
        .theme-toggle {
            position: absolute; top: 0; right: 0; background: var(--card); border: 1px solid var(--border);
            border-radius: 50%; width: 45px; height: 45px; cursor: pointer; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
        }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 2.5rem; letter-spacing: -1.5px; margin: 0; }
        h1 span { color: var(--accent); }
        .card {
            background: var(--card); border-radius: 24px; padding: 32px;
            border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        textarea {
            width: 100%; height: 160px; border-radius: 16px; padding: 20px;
            background: var(--bg); color: var(--text); border: 1px solid var(--border);
            outline: none; font-family: monospace; resize: none; box-sizing: border-box;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: var(--accent); }
        .btn-main {
            width: 100%; margin-top: 20px; padding: 16px; border-radius: 12px;
            background: var(--accent); color: #fff; border: none; font-weight: 700;
            cursor: pointer; font-size: 1rem; transition: transform 0.2s;
        }
        .btn-main:active { transform: scale(0.98); }
        .result-area { margin-top: 32px; display: none; }
        .result-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; font-weight: 700; color: var(--subtext); }
        #copy-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: 800; }
        
        pre {
            padding: 20px; background: var(--pre-bg); border-radius: 12px;
            overflow-x: auto; font-size: 11px; border: 1px solid var(--accent);
            color: var(--accent); white-space: pre; word-break: normal;
        }

        .history { margin-top: 32px; border-top: 1px solid var(--border); padding-top: 20px; display: none; }
        .history-item { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; opacity: 0.7; }
    </style>
</head>
<body data-theme="dark">

<div class="container">
    <button class="theme-toggle" onclick="toggleTheme()">☀️</button>
    
    <header>
        <h1>SSH <span>Clean.</span></h1>
        <p style="color: var(--subtext)">Repair messy PEM keys.</p>
    </header>

    <div class="card">
        <textarea id="input" placeholder="Paste your messy PEM key or Public Key here..."></textarea>
        <button class="btn-main" onclick="handleFormat()">Format & Repair Key</button>

        <div id="result-area" class="result-area">
            <div class="result-header">
                <span id="key-type">RESULT</span>
                <button id="copy-btn" onclick="copyResult()">COPY KEY</button>
            </div>
            <pre id="output"></pre>
        </div>

        <div id="history-section" class="history">
            <p style="font-size: 10px; font-weight: 800; color: var(--subtext); text-transform: uppercase;">Recent Activity</p>
            <div id="history-list"></div>
        </div>
    </div>
</div>

<script>
    // Theme Management
    function toggleTheme() {
        const body = document.body;
        const current = body.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        body.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        document.querySelector('.theme-toggle').innerText = next === 'dark' ? '☀️' : '🌙';
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);
    document.querySelector('.theme-toggle').innerText = savedTheme === 'dark' ? '☀️' : '🌙';

    // Formatting Logic
    function handleFormat() {
        const input = document.getElementById('input').value;
        const cleaned = input.replace(/\r\n/g, "\n").trim();
        
        // Handle standard one-line Public Keys
        if (cleaned.startsWith("ssh-") || cleaned.startsWith("ecdsa-")) {
            const parts = cleaned.split(/\s+/);
            const formatted = parts.join(" ");
            showResult(formatted, "Standard Public Key");
            return;
        }

        // Handle PEM blocks
        const pemRegex = /(-----BEGIN ([A-Z ]+)-----)([\s\S]*?)(-----END \2-----)/i;
        const match = cleaned.match(pemRegex);

        if (!match) {
            alert("❌ No valid SSH key found. Ensure it has -----BEGIN... headers or starts with ssh-.");
            return;
        }

        const header = match[1].trim();
        const keyType = match[2].trim();
        const footer = match[4].trim();
        
        const rawBase64 = match[3].replace(/\s+/g, "");

        if (!rawBase64) {
            alert("❌ The key body appears to be empty. Check your input.");
            return;
        }

        const wrappedChunks = rawBase64.match(/.{1,64}/g);
        const wrapped = wrappedChunks ? wrappedChunks.join("\n") : "";
        const formatted = `${header}\n${wrapped}\n${footer}`;

        showResult(formatted, keyType);
    }

    function showResult(formattedText, typeLabel) {
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('output').innerText = formattedText;
        document.getElementById('key-type').innerText = typeLabel;
        updateHistory(typeLabel);
    }

    function updateHistory(type) {
        let history = JSON.parse(localStorage.getItem('ssh_history') || "[]");
        const newItem = { type, date: new Date().toLocaleTimeString() };
        history = [newItem, ...history].slice(0, 3);
        localStorage.setItem('ssh_history', JSON.stringify(history));
        renderHistory(history);
    }

    function renderHistory(history) {
        const list = document.getElementById('history-list');
        const section = document.getElementById('history-section');
        if (history.length > 0) {
            section.style.display = 'block';
            list.innerHTML = history.map(item => `
                <div class="history-item">
                    <span>${item.type}</span>
                    <span>${item.date}</span>
                </div>
            `).join('');
        }
    }

    // Copy to Clipboard
    function copyResult() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copy-btn');
            btn.innerText = "✓ COPIED";
            setTimeout(() => btn.innerText = "COPY KEY", 2000);
        });
    }

    renderHistory(JSON.parse(localStorage.getItem('ssh_history') || "[]"));
</script>

</body>
</html>
